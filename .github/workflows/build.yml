name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  command-line-tools:
    name: Command Line Tools build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version || true
          swift --version
          clang --version
      - name: Build universal binary
        run: ./build-clt.sh
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: MenuMeters-clt
          path: out/MenuMeters

  xcode:
    name: Xcode build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build MenuMeters
        run: |
          xcodebuild \
            -project MenuMeters.xcodeproj \
            -scheme "MenuMeters No Sparkle" \
            -configuration Release \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            build
